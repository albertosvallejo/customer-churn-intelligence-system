name: ci-reproducibility

on:
  push:
    branches:
      - main
      - master
      - "feature/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reproducible-line:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_ENV: test
      MODE: synthetic_demo
      LLM_MODE: disabled
      PHASE7_LLM_PROVIDER: fake
      CI_FAKE_LLM: "1"
      OPENAI_API_KEY: ci-fake-key-not-used
      OPENAI_MODEL: gpt-5.1-mini
      PHASE7_REVIEW_TOKEN: change-this-local-demo-token
      CHURN_API_HOST: 0.0.0.0
      CHURN_API_PORT: 62881
      BASE_URL: http://127.0.0.1:62881
      RUN_DATE: 20260727
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Python
        run: |
          ruff check src tests scripts

      - name: Run unit + integration + contract tests
        run: |
          pytest -q

      - name: Validate synthetic demo manifests
        run: |
          python scripts/validate_phase7_synthetic_demo_manifest.py

      - name: Fake LLM smoke
        run: |
          python scripts/ci_fake_llm_smoke.py

      - name: Prepare CI env file
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path
          env_path = Path('.env')
          lines = env_path.read_text().splitlines()
          overrides = {
              'APP_ENV': 'test',
              'MODE': 'synthetic_demo',
              'LLM_MODE': 'disabled',
              'PHASE7_LLM_PROVIDER': 'fake',
              'CI_FAKE_LLM': '1',
              'OPENAI_API_KEY': 'ci-fake-key-not-used',
              'OPENAI_MODEL': 'gpt-5.1-mini',
              'PHASE7_REVIEW_TOKEN': 'change-this-local-demo-token',
              'CHURN_API_HOST': '0.0.0.0',
              'CHURN_API_PORT': '62881',
          }
          found = set()
          out = []
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  key = line.split('=', 1)[0]
                  if key in overrides:
                      out.append(f'{key}={overrides[key]}')
                      found.add(key)
                      continue
              out.append(line)
          for key, value in overrides.items():
              if key not in found:
                  out.append(f'{key}={value}')
          env_path.write_text('\n'.join(out) + '\n')
          PY

      - name: Docker compose build
        run: |
          docker compose build

      - name: Docker compose up
        run: |
          docker compose up -d

      - name: Wait for API health
        run: |
          python scripts/http_healthcheck.py http://127.0.0.1:62881/health

      - name: HTTP smoke
        run: |
          bash scripts/demo_verify.sh

      - name: Docker compose logs on failure
        if: failure()
        run: |
          docker compose logs --no-color

      - name: Docker compose down
        if: always()
        run: |
          docker compose down -v
